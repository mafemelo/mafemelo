<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Portfólio de Maria Fernanda Melo e Reis">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#d9d8df"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#241e32" flood-opacity=".16"/></filter>
  </defs>
  <rect width="880" height="340" rx="18" fill="#f6f6f3"/>
  <rect width="880" height="340" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="879" height="339" rx="17.5" fill="none" stroke="#dddce3"/>

  <text x="440" y="196" text-anchor="middle" font-size="86" font-weight="800" letter-spacing="-3" fill="#24222b" fill-opacity=".07" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">[MAFÊ MELO]</text>

  <!-- pastas -->
  <g filter="url(#sh)">
  <g transform="translate(86,56)">
    <rect x="34" y="0" width="34" height="12" rx="4" fill="#866ec5"/>
    <rect x="0" y="8" width="84" height="56" rx="6" fill="#cdc2f4"/>
    <rect x="-8" y="76" width="85" height="22" rx="6" fill="#fbfbf9"/>
    <text x="34.5" y="91" text-anchor="middle" font-size="12.5" font-weight="500" fill="#24222b" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">sobre mim</text>
  </g>
  <g transform="translate(86,196)">
    <rect x="34" y="0" width="34" height="12" rx="4" fill="#c15e50"/>
    <rect x="0" y="8" width="84" height="56" rx="6" fill="#f5bab0"/>
    <rect x="-8" y="76" width="78" height="22" rx="6" fill="#fbfbf9"/>
    <text x="31.0" y="91" text-anchor="middle" font-size="12.5" font-weight="500" fill="#24222b" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">projetos</text>
  </g>
  <g transform="translate(714,56)">
    <rect x="34" y="0" width="34" height="12" rx="4" fill="#009891"/>
    <rect x="0" y="8" width="84" height="56" rx="6" fill="#94dad5"/>
    <rect x="-8" y="76" width="106" height="22" rx="6" fill="#fbfbf9"/>
    <text x="45.0" y="91" text-anchor="middle" font-size="12.5" font-weight="500" fill="#24222b" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">experiências</text>
  </g>
  <g transform="translate(714,196)">
    <rect x="34" y="0" width="34" height="12" rx="4" fill="#a87600"/>
    <rect x="0" y="8" width="84" height="56" rx="6" fill="#e3c697"/>
    <rect x="-8" y="76" width="71" height="22" rx="6" fill="#fbfbf9"/>
    <text x="27.5" y="91" text-anchor="middle" font-size="12.5" font-weight="500" fill="#24222b" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">contato</text>
  </g></g>

  <!-- câmera -->
  <g transform="translate(394,22)" filter="url(#sh)">
    <rect x="14" y="2" width="22" height="9" rx="3" fill="#fff" stroke="#dddce3"/>
    <rect x="1" y="9" width="90" height="55" rx="10" fill="#fff" stroke="#dddce3"/>
    <clipPath id="cc"><rect x="1" y="9" width="90" height="55" rx="10"/></clipPath>
    <g clip-path="url(#cc)"><rect x="1" y="17" width="22.5" height="7" fill="#866ec5"/><rect x="23.5" y="17" width="22.5" height="7" fill="#c15e50"/><rect x="46" y="17" width="22.5" height="7" fill="#009891"/><rect x="68.5" y="17" width="22.5" height="7" fill="#a87600"/></g>
    <circle cx="46" cy="42" r="15" fill="#fff" stroke="#dddce3"/><circle cx="46" cy="42" r="11.5" fill="#24222b"/><circle cx="46" cy="42" r="5.5" fill="#3a2a66"/><circle cx="42" cy="38" r="1.8" fill="#fff" opacity=".7"/>
    <rect x="68" y="30" width="13" height="7" rx="2" fill="#ecebf0"/><rect x="26" y="59" width="40" height="2.5" rx="1.25" fill="#dddce3"/>
  </g>
  <rect x="418" y="100" width="44" height="22" rx="6" fill="#fbfbf9"/>
  <text x="440" y="115" text-anchor="middle" font-size="12.5" font-weight="500" fill="#24222b" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">câmera</text>

  <!-- polaroid com a foto -->
  <g transform="translate(255,34) rotate(-6)" filter="url(#sh)">
    <rect width="104" height="124" fill="#fff"/>
    <image href="data:image/jpeg;base64," x="7" y="7" width="90" height="90" preserveAspectRatio="xMidYMid slice"/>
    <text x="52" y="113" text-anchor="middle" font-size="11" font-weight="600" fill="#24222b" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">mafê, 18</text>
    <rect x="30" y="-8" width="44" height="15" fill="#d9d8df" fill-opacity=".85"/>
  </g>

  <!-- post-it -->
  <g transform="translate(350,212) rotate(-2)" filter="url(#sh)">
    <rect width="190" height="100" fill="#f9ebbe"/>
    <rect x="62" y="-8" width="66" height="18" fill="#d9d8df" fill-opacity=".85"/>
    <text x="18" y="38" font-size="17" font-weight="700" fill="#4a3f2a" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">olá! eu sou a Mafê.</text>
    <text x="18" y="62" font-size="13" fill="#4a3f2a" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">estudante de Engenharia</text>
    <text x="18" y="80" font-size="13" fill="#4a3f2a" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif">de Software · PUC Minas</text>
  </g>
</svg>